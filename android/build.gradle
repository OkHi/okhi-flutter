buildscript {
    ext.kotlin_version = "2.4.0"
    repositories {
        google()
        mavenCentral()
        maven { url "https://repo.okhi.io/artifactory/maven" }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://repo.okhi.io/artifactory/maven" }
    }
}

apply plugin: "com.android.library"

// Kotlin support:
// - AGP 9+ with built-in Kotlin (the default) compiles Kotlin itself; kotlin-android must not be applied.
// - Flutter 3.47+ applies kotlin-android to plugins itself when built-in Kotlin is off (AGP 8, or
//   android.builtInKotlin=false), so it is normally already applied by the time this script runs.
// - Older Flutter versions don't, so apply it here only if nothing else has.
def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def builtInKotlinProperty = project.findProperty("android.builtInKotlin")
def builtInKotlinEnabled = agpMajorVersion >= 9 &&
        (builtInKotlinProperty == null || builtInKotlinProperty.toString().toBoolean())
if (!builtInKotlinEnabled && !project.pluginManager.hasPlugin("org.jetbrains.kotlin.android")) {
    project.pluginManager.apply("org.jetbrains.kotlin.android")
}

android {
    namespace = "io.okhi.flutter.okhi_flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation("io.okhi.android:okhi:1.0.24")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}
