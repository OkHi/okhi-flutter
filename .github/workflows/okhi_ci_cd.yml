name: OkHi Flutter CI/CD 2026

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read

jobs:
  build-ios:
    name: Build iOS for TestFlight
    runs-on: macos-latest
    needs: build-android
    # Check out into a folder named after the plugin. For a plugin's example app,
    # Flutter adds the plugin's own Swift package (ios/okhi_flutter) to the Xcode
    # project; SwiftPM then fails with "unable to override package 'okhi_flutter'"
    # unless the repo folder name matches the plugin name.
    defaults:
      run:
        working-directory: okhi_flutter

    steps:
      - uses: actions/checkout@v4
        with:
          path: okhi_flutter

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Navigate to example and Get dependencies
        run:  |
          cd example
          flutter pub get

      - name: ☄️ Analyze code
        run: flutter analyze

      - name: ✅ Run tests
        run: flutter test

      - name: 🏗️ Build iOS (CocoaPods fallback)
        run:   |
          cd example
          flutter config --no-enable-swift-package-manager
          flutter build ios -t lib/main_workspace.dart --release --no-codesign

      - name: 🏗️ Build iOS (Swift Package Manager)
        run:   |
          cd example
          flutter config --enable-swift-package-manager
          flutter build ios -t lib/main_workspace.dart --release --no-codesign

      - name: 📦 Prepare & Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: okhi_flutter/example/build/ios/iphoneos/OkHiFlutterForIOS.app

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

